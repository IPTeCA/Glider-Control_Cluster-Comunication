[project]
name = "flight-control-system"
version = "0.1.0"
description = "Windows measurement and logging tools for the Flight Control System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.0",
    "opencv-python>=4.10.0.84",
    "pandas>=2.2.0",
    "PyOpenGL>=3.1.7",
    "pyqtgraph>=0.13.7",
    "pyserial>=3.5",
    "PySide6>=6.8.0",
    "trimesh>=4.5.0",
]

[tool.uv]
package = false
